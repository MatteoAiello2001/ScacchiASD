# Rilascio in produzione su Azure (App Service "scacchiasd").
# Parte a ogni push su main (cioe' dopo ogni merge), oppure a mano da GitHub: Actions > Deploy > Run workflow.
# Il backend serve anche il frontend compilato (cartella wwwroot): si rilascia un unico pacchetto.
# Accesso ad Azure senza password: GitHub si presenta con un token (OIDC) che Azure riconosce
# grazie alla credenziale federata dell'identita' "id-scacchiasd-github".

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un rilascio alla volta. Uno gia' partito non viene interrotto a meta'.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Pacchetto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish backend
        working-directory: backend
        run: dotnet publish ScacchiASD.Api --configuration Release --output ../pacchetto

      - name: Frontend dentro wwwroot del backend
        run: |
          mkdir -p pacchetto/wwwroot
          cp -r frontend/dist/frontend/browser/. pacchetto/wwwroot/

      - uses: actions/upload-artifact@v7
        with:
          name: pacchetto
          path: pacchetto
          if-no-files-found: error

  production:
    name: Produzione
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pacchetto
          path: pacchetto

      - name: Accesso ad Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Rilascio su App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: scacchiasd
          package: pacchetto
