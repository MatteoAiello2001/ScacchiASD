# Rilascio su Azure, in base al branch:
#   push su staging (merge di una PR su staging)    -> Pacchetto -> Staging
#   push su main    (merge della PR staging -> main) -> Pacchetto -> Produzione
# Si puo' anche lanciare a mano: Actions > Deploy > Run workflow, scegliendo il branch.
#
# - main e' sempre cio' che c'e' in produzione, staging e' sempre cio' che c'e' in staging.
# - Il merge su main e' l'approvazione per la produzione: non c'e' un'altra conferma.
# - Il backend serve anche il frontend compilato (cartella wwwroot): un unico pacchetto.
# - Dopo ogni rilascio un controllo chiama /api/info e verifica che il sito risponda con la
#   versione appena pubblicata; se no, il rilascio diventa rosso.
# - Accesso ad Azure senza password (OIDC): ogni environment ha la sua identita',
#   che puo' pubblicare solo sulla propria app (staging non puo' toccare prod).

name: Deploy

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Pacchetto
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      versione: ${{ steps.versione.outputs.valore }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Data del rilascio + numero progressivo del workflow, es. 2026.11.13-42.
      # Si vede nell'header del sito e nel riepilogo di questa esecuzione.
      - name: Versione
        id: versione
        run: |
          versione="$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          echo "valore=$versione" >> "$GITHUB_OUTPUT"
          echo "### Versione $versione (${{ github.ref_name }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish backend
        working-directory: backend
        run: >
          dotnet publish ScacchiASD.Api --configuration Release --output ../pacchetto
          -p:InformationalVersion=${{ steps.versione.outputs.valore }}
          -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Frontend dentro wwwroot del backend
        run: |
          mkdir -p pacchetto/wwwroot
          cp -r frontend/dist/frontend/browser/. pacchetto/wwwroot/

      - uses: actions/upload-artifact@v7
        with:
          name: pacchetto
          path: pacchetto
          if-no-files-found: error

  staging:
    name: Staging
    if: github.ref == 'refs/heads/staging'
    needs: build
    runs-on: ubuntu-latest
    # Un rilascio alla volta su staging; uno gia' partito non viene interrotto a meta'.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://scacchiasd-staging-ffh9gyhjgsdcbcgd.italynorth-01.azurewebsites.net
    permissions:
      contents: read
      id-token: write
    env:
      INDIRIZZO: https://scacchiasd-staging-ffh9gyhjgsdcbcgd.italynorth-01.azurewebsites.net
      VERSIONE: ${{ needs.build.outputs.versione }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pacchetto
          path: pacchetto

      - name: Accesso ad Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Rilascio su App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: scacchiasd-staging
          package: pacchetto

      - name: Controllo dopo il rilascio
        run: |
          for i in $(seq 1 20); do
            risposta=$(curl --silent --max-time 60 "$INDIRIZZO/api/info" || true)
            echo "Tentativo $i: $risposta"
            case "$risposta" in
              *"\"versione\":\"$VERSIONE\""*) echo "Il sito risponde con la versione $VERSIONE"; exit 0 ;;
            esac
            sleep 15
          done
          echo "::error::Il sito non risponde con la versione $VERSIONE"
          exit 1

  production:
    name: Produzione
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://scacchiasd-c7gxdch7amgsb4cf.italynorth-01.azurewebsites.net
    permissions:
      contents: read
      id-token: write
    env:
      INDIRIZZO: https://scacchiasd-c7gxdch7amgsb4cf.italynorth-01.azurewebsites.net
      VERSIONE: ${{ needs.build.outputs.versione }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pacchetto
          path: pacchetto

      - name: Accesso ad Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Rilascio su App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: scacchiasd
          package: pacchetto

      - name: Controllo dopo il rilascio
        run: |
          for i in $(seq 1 20); do
            risposta=$(curl --silent --max-time 60 "$INDIRIZZO/api/info" || true)
            echo "Tentativo $i: $risposta"
            case "$risposta" in
              *"\"versione\":\"$VERSIONE\""*) echo "Il sito risponde con la versione $VERSIONE"; exit 0 ;;
            esac
            sleep 15
          done
          echo "::error::Il sito non risponde con la versione $VERSIONE"
          exit 1
