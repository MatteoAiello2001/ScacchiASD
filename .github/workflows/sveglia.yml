# Tiene sveglie le app sul piano gratuito F1, che si spengono dopo circa 20 minuti senza visite
# (e poi la prima pagina ci mette circa 2 minuti). Ogni 10 minuti chiama /api/info di prod e staging.
#
# /api/info NON usa il database: il database continua ad andare in pausa dopo 60 minuti senza uso
# e non consuma le ore gratuite del mese. Costo per l'app: pochi millisecondi di CPU per chiamata.
#
# GitHub non garantisce l'orario esatto dei workflow programmati: a volte ritardano o ne saltano uno.
# Se il repo resta 60 giorni senza commit, GitHub sospende questo workflow e manda un'email per riattivarlo.

name: Sveglia

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Se una chiamata fallisce il workflow resta verde (niente email ogni 10 minuti),
      # ma l'avviso compare nel riepilogo dell'esecuzione.
      - name: Produzione
        run: |
          curl --fail --silent --show-error --max-time 180 https://scacchiasd-c7gxdch7amgsb4cf.italynorth-01.azurewebsites.net/api/info \
            || echo "::warning::Produzione non ha risposto"

      - name: Staging
        run: |
          curl --fail --silent --show-error --max-time 180 https://scacchiasd-staging-ffh9gyhjgsdcbcgd.italynorth-01.azurewebsites.net/api/info \
            || echo "::warning::Staging non ha risposto"
