# Aggiornamenti automatici delle dipendenze: Dependabot apre una pull request a settimana
# per ecosistema, con gli aggiornamenti raggruppati. Ogni PR passa dalla CI prima del merge.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # Questi pacchetti seguono la versione di .NET (oggi 10, LTS): il passaggio a una
      # major nuova si fa a mano insieme a TargetFramework e global.json.
      - dependency-name: 'Microsoft.AspNetCore.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Microsoft.EntityFrameworkCore*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'System.*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
      npm:
        patterns: ['*']
        exclude-patterns: ['@angular/*', '@angular-devkit/*']
    ignore:
      # Le major di Angular si fanno a mano con "ng update" (migrano anche il codice).
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      # La versione di TypeScript la decide Angular (Angular 22 vuole TypeScript 6.0.x):
      # si aggiorna insieme ad Angular, non da sola.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
